[package]
name = "fasti-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "fasti_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
fasti-application = { path = "../../../crates/fasti-application" }
fasti-domain = { path = "../../../crates/fasti-domain" }
fasti-store = { path = "../../../crates/fasti-store" }
getrandom = "0.3.4"
futures-util = "=0.3.34"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "=2.11.5", default-features = false, features = ["wry"] }
tokio = { version = "1.53.1", features = ["net"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = "=4.1.6"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "=1.0.0"
keyring-core = "=1.0.0"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dev-dependencies]
tempfile = "3.27.0"

# Keep desktop platform dependencies out of the headless core workspace.
[workspace]
