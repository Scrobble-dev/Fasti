[package]
name = "fasti-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
fasti-application = { path = "../../../crates/fasti-application" }
fasti-domain = { path = "../../../crates/fasti-domain" }
fasti-store = { path = "../../../crates/fasti-store" }
getrandom = "0.3.4"
keyring = "=4.1.6"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.11.5", default-features = false, features = ["wry"] }

[build-dependencies]
tauri-build = "=2.6.3"

[dev-dependencies]
tempfile = "3.27.0"

# Keep desktop platform dependencies out of the headless core workspace.
[workspace]
