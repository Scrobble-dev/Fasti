[package]
name = "fasti-desktop"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Fasti Contributors <hello@scrobble.dev>"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

