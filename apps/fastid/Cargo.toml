[package]
name = "fastid"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Fasti Node daemon exposing the currently implemented local HTTP surface"

[[bin]]
name = "fastid"
path = "src/main.rs"

[features]
default = []
tmdb-smoke-fixture = ["fasti-provider-runtime/tmdb-smoke-fixture"]

[dependencies]
fasti-api = { workspace = true }
fasti-application = { workspace = true }
fasti-provider-runtime = { workspace = true }
fasti-store = { workspace = true }
axum = { workspace = true }
getrandom = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
sha2 = "0.11.0"
