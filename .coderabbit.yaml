# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
enable_free_tier: true

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  suggested_labels: true
  fail_commit_status: false
  enable_prompt_for_ai_agents: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "dev"
      - "release"
    ignore_title_keywords:
      - "WIP"
      - "wip"
      - "Draft"
      - "draft"
    exclude_users:
      - "dependabot[bot]"
      - "github-actions[bot]"

  path_filters:
    - "!contracts/generated/**"
    - "!packages/sdk/src/generated/**"
    - "!Cargo.lock"
    - "!pnpm-lock.yaml"
    - "!target/**"
    - "!benchmarks/b1/fixtures/**"
    - "!brand/assets/**"
    - "!apps/desktop/src-tauri/gen/**"
    - "!tests/fixtures/**"

  tools:
    ast-grep:
      essential_rules: true
    clippy:
      enabled: true
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    gitleaks:
      enabled: true
    biome:
      enabled: true
    eslint:
      enabled: true

  path_instructions:
    - path: "crates/fasti-domain/**"
      instructions: |
        Verify domain invariants and identity rules:
        - Product boundary: Fasti records. Players play. No playback or player claims.
        - Canonical identity: Every record has an opaque immutable local ID (`rec_*`). External provider IDs (IMDb, Spotify, TMDB) are typed claims (`xid_*`) and NEVER canonical keys.
        - Uncertainty preservation: Incomplete/unresolved records are valid first-class data. Never drop or guess missing fields.
        - Immutability: Original observations (`obs_*`) are immutable evidence.
        - Append-only semantics: Audits, splits, and merges must preserve provenance.

    - path: "crates/fasti-application/**"
      instructions: |
        Verify application capabilities, ports, and authorization:
        - Capability ownership: Capabilities must correspond to registry definitions in `contracts/registry/v1/capabilities.yaml`.
        - Authorization: Check permissions before data mutation.
        - Idempotency: All mutating operations with retries must guarantee idempotent execution and durable receipts.
        - Error handling: Use typed problems; do not leak unredacted raw errors or secrets.

    - path: "crates/fasti-store/**"
      instructions: |
        Verify persistence, migrations, and concurrency:
        - Crash durability & ACID: SQLite transactions must be atomic and crash-resilient.
        - Migration safety: Migrations must be reversible or explicitly audited for backward compatibility.
        - Zero unhandled panic paths in database transaction boundaries.

    - path: "crates/fasti-api/**"
      instructions: |
        Verify REST API handlers and DTO mappings:
        - OpenAPI parity: Operations and DTOs must bind cleanly to Utoipa specs matching generated OpenAPI schemas.
        - Input boundaries: Reject oversized or malformed payloads fail-closed.
        - Typed responses: Return RFC 7807 problem payloads on errors.

    - path: "apps/fastid/**"
      instructions: |
        Verify daemon runtime boundaries:
        - Resource boundaries: Strictly enforce the 64 MiB idle and 192 MiB process ceiling memory envelopes.
        - Network binding: Default to IPv4 loopback (`127.0.0.1`) only; verify link-local SSRF defenses.
        - Zero telemetry: Strictly reject any third-party analytics, tracking, or phone-home code.

    - path: "crates/fasti-cli/**"
      instructions: |
        Verify CLI command boundaries:
        - Guarded execution: Ensure CLI commands consume generated capability projections and respect non-delegable authorization.
        - Error formatting: Emit machine-readable typed problems and actionable human diagnostics.

    - path: "contracts/**"
      instructions: |
        Check for semantic contract drift:
        - The registry at `contracts/registry/v1/capabilities.yaml` and seeds at `contracts/identity/` own machine truth.
        - Flag any breaking change to OpenAPI 3.1, AsyncAPI 3.x, JSON Schema 2020-12, JSON-LD 1.1, or OKF 0.2 surfaces.
        - Do not comment on formatting or code style for generated contract outputs.

    - path: ".github/workflows/**"
      instructions: |
        Verify CI/CD supply chain and workflow security:
        - Ensure least-privilege token permissions (`permissions:` explicitly defined at workflow and job level). Before B8, strictly require read-only permissions for every workflow; reject any write or other non-read permission.
        - Flag unpinned actions or untrusted script execution.
        - Ensure workflows do not introduce unauthorized public release publication paths before B8.

    - path: "tests/**"
      instructions: |
        Verify test assertions:
        - Ensure tests verify observable behavior, failure modes, and invariant boundaries rather than internal mock implementation details.

    - path: "packages/sdk/**"
      instructions: |
        Verify TypeScript SDK contracts and behavior:
        - Contract conformance: Match authored DTO schemas and non-retrying idempotent operations.
        - Response validation: Validate all responses against typed problems.
        - Zero telemetry: Strictly verify no telemetry, tracking, or phone-home code.
        - Product boundary: Fasti records. Players play. No playback or stream handling.

    - path: "scripts/**"
      instructions: |
        Verify development and build tooling:
        - Process lifecycle: Ensure long-running launchers clean up background child processes on exit/signals.
        - Determinism: Code generation and lint checks must be reproducible and offline-safe.
        - Secret safety: Never print tokens or sensitive data to stdout or log files.

knowledge_base:
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "brand/DESIGN.md"
      - "contracts/README.md"
      - "docs/constitution.md"
      - "docs/definition-of-done.md"
      - "docs/handoffs/FASTI_MASTER_INTEGRATOR_HANDOFF.md"
  learnings:
    scope: "auto"
  issues:
    scope: "auto"
  pull_requests:
    scope: "auto"

chat:
  art: false
  auto_reply: true

