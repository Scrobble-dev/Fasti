# Fasti Codecov Configuration
codecov:
  require_ci_to_pass: false
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
      rust:
        target: auto
        threshold: 1%
        flags:
          - rust
      javascript:
        target: auto
        threshold: 1%
        flags:
          - javascript
    patch:
      default:
        target: auto
        threshold: 1%

flags:
  rust:
    paths:
      - crates/
      - apps/
      - xtask/
    carryforward: false
  javascript:
    paths:
      - packages/
      - scripts/
    carryforward: false

ignore:
  - "benchmarks/**/*"
  - "contracts/generated/**/*"
  - "contracts/examples/**/*"
  - "fixtures/**/*"
  - "tests/**/*"
  - "brand/**/*"
  - "**/*.test.*"
  - "**/*_test.rs"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true
