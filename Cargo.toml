[workspace]
resolver = "2"
members = [
  "apps/fastid",
  "crates/fasti-domain",
  "crates/fasti-application",
  "crates/fasti-contracts",
  "crates/fasti-store",
  "crates/fasti-api",
  "crates/fasti-cli",
  "xtask",
]

[workspace.package]
version = "0.1.0"
authors = ["Fasti Contributors <hello@scrobble.dev>"]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Scrobble-dev/Fasti"
homepage = "https://scrobble.dev"
publish = false

[workspace.dependencies]
# Internal crates
fasti-domain = { path = "crates/fasti-domain", version = "0.1.0" }
fasti-application = { path = "crates/fasti-application", version = "0.1.0" }
fasti-contracts = { path = "crates/fasti-contracts", version = "0.1.0" }
fasti-store = { path = "crates/fasti-store", version = "0.1.0" }
fasti-api = { path = "crates/fasti-api", version = "0.1.0" }

# Async & Runtime
tokio = { version = "1.40", features = ["full"] }

# Serialization & Models
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
utoipa = "5.5"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Web & API
axum = { version = "0.7", features = ["macros", "ws"] }
tower = { version = "0.5", features = ["util", "timeout"] }

# SQLite & Persistence
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }

# CLI & Utilities
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1.0"
anyhow = "1.0"
serde-saphyr = "1.0.1"
proptest = "1.6"
static_assertions = "1.1"
getrandom = "0.3"
