[workspace]
resolver = "2"
members = [
  "apps/fastid",
  "crates/fasti-domain",
  "crates/fasti-application",
  "crates/fasti-contracts",
  "crates/fasti-store",
  "crates/fasti-api",
  "crates/fasti-cli",
  "xtask",
]

[workspace.package]
version = "0.1.0"
authors = ["Fasti Contributors <hello@scrobble.dev>"]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Scrobble-dev/Fasti"
homepage = "https://scrobble.dev"
publish = false

[workspace.dependencies]
# Internal crates
fasti-domain = { path = "crates/fasti-domain", version = "0.1.0" }
fasti-application = { path = "crates/fasti-application", version = "0.1.0" }
fasti-contracts = { path = "crates/fasti-contracts", version = "0.1.0" }
fasti-store = { path = "crates/fasti-store", version = "0.1.0" }
fasti-api = { path = "crates/fasti-api", version = "0.1.0" }

# Async & Runtime
tokio = { version = "1.40", features = ["full"] }

# Serialization & Models
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
utoipa = "5.5"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Web & API
axum = { version = "0.8", features = ["macros", "ws"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.7", features = ["fs"] }

# SQLite & Persistence
rusqlite = { version = "0.40", features = ["backup", "bundled", "chrono", "hooks", "uuid"] }

# CLI & Utilities
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
anyhow = "1.0"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
hmac = "0.12.1"
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
sha1 = "0.10.7"
url = "2.5.7"
webauthn-rs = { version = "=0.5.5", features = ["danger-allow-state-serialisation"] }
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }
argon2 = "0.5.3"
serde-saphyr = "1.0.1"
proptest = "1.6"
static_assertions = "1.1"
getrandom = "0.4"
rustix = { version = "1.1.4", features = ["fs"] }
tar = { version = "0.4.46", default-features = false }
zstd = { version = "0.13.3", default-features = false }
