schema: https://scrobble.dev/schemas/fasti/capabilities-ledger/2
version: 2.0.0-planning-seed
generated_on: '2026-08-21'
status: planning_seed_not_runtime_contract
product: Fasti
product_boundary: Fasti records. Players play.
source_of_truth_rule: Each public product capability has one semantic identity and may have multiple bindings.
network_boundary_classes:
- safe_http
- local_discovery
- safe_broker
- live_transport
- external_action
default_security_rules:
- deny undeclared capability and scope
- derive workspace, profile, device and client authority from authenticated context
- require explicit deletion or tombstone
- require application-level idempotency for remote mutations
- keep personal data out of mDNS TXT records and MQTT topic names
- do not treat discovery as authentication
- do not route broker or connector input directly to storage
user_success_rules:
- state the user capability and immediate payoff
- teach complex concepts at the point of need
- make local, queued, synced, failed and approval states visible
- measure meaningful user results instead of feature activity
capabilities:
- id: node.discovery.advertise
  title: Advertise this Fasti node
  plain_language: Make this Fasti node visible to approved devices on the local network.
  domain: local_discovery
  risk: read
  offline: local_network_only
  scopes:
  - node.discovery:advertise
  network:
    class: local_multicast
    default_policy: trusted_private_interfaces_only
    service_type: _fasti._tcp.local.
  data_exposed:
  - opaque_node_id
  - protocol_version
  - endpoint
  - pairing_support
  events:
    emits:
    - node.discovery.advertised
  knowledge: knowledge/capabilities/node-discovery-advertise.md
  user_payoff: A local client can find Fasti without an IP address.
  status: planned_alpha
- id: node.discovery.browse
  title: Find local Fasti nodes
  plain_language: Find Fasti nodes that advertise on the local network.
  domain: local_discovery
  risk: read
  offline: local_network_only
  scopes:
  - node.discovery:browse
  network:
    class: local_multicast
  events:
    emits:
    - node.discovery.found
    - node.discovery.lost
  knowledge: knowledge/capabilities/node-discovery-browse.md
  user_payoff: The device shows nearby Fasti nodes automatically.
  status: planned_alpha
- id: node.discovery.diagnostics.read
  title: Read local discovery diagnostics
  plain_language: Show which network interfaces and service records Fasti is using.
  domain: local_discovery
  risk: read_sensitive
  offline: local_network_only
  scopes:
  - diagnostics:read
  events:
    emits: []
  knowledge: knowledge/capabilities/node-discovery-diagnostics.md
  user_payoff: A user can resolve discovery problems without guessing.
  status: planned_alpha
