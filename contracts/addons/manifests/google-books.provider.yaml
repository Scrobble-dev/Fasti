api_version: fasti.scrobble.dev/addons/v0.1
kind: MetadataProvider
metadata:
  id: google-books
  name: Google Books
  version: 0.1.0
  status: review
  description: Bounded Google Books volume search for neutral book candidates.
  licence: Google Books API terms apply. Complete release terms review before distribution.
  sources:
    - https://developers.google.com/books/docs/v1/using
    - https://developers.google.com/books/docs/v1/reference/volumes/list
    - https://cloud.google.com/docs/authentication/api-keys-use

compatibility:
  fasti: ">=0.1.0 <0.2.0"
  manifest_schema: 0.1.0

permissions:
  network:
    hosts:
      - www.googleapis.com
    schemes:
      - https
    methods:
      - GET
    classes:
      - public
  secrets:
    - google_books_api_key
  capabilities:
    - metadata.search
  writes: []

authentication:
  type: header
  header: X-Goog-Api-Key
  secret_ref: secret:providers/google-books/api-key
  required: true
  sources:
    - environment: GOOGLE_BOOKS_API_KEY

record_support:
  - record_type: book
    result_kind: book

operations:
  search:
    method: GET
    path: /books/v1/volumes
    query:
      q: ${input.query}
      startIndex: 0
      maxResults: 10
      projection: lite
    headers:
      X-Goog-Api-Key: ${secret.google_books_api_key}
    items_path: $.items

normalization:
  candidate:
    provider: google-books
    provider_id: $.id
    title: $.volumeInfo.title
    kind: book
    authors: $.volumeInfo.authors
  local_record_write: none

limits:
  max_results: 10
  max_query_bytes: 256
  max_response_bytes: 2000000
  timeout_seconds: 15
  redirects: none
  denied_network_classes:
    - loopback
    - private
    - link_local
    - multicast
    - unspecified
    - documentation
    - reserved

errors:
  "400":
    code: provider_credential_invalid
    user_action: Replace or remove the provider key. Fasti local data is unchanged.
  "401":
    code: provider_credential_invalid
    user_action: Replace or remove the provider key. Fasti local data is unchanged.
  "403":
    code: provider_credential_invalid
    user_action: Replace or remove the provider key. Fasti local data is unchanged.
  "429":
    code: provider_rate_limited
    user_action: Wait, then retry. Fasti local data is unchanged.
  invalid_response:
    code: provider_response_invalid
    user_action: Retry later. Fasti local data is unchanged.

runtime:
  trusted_hosts:
    - tauri_desktop
    - tauri_android
  browser_enabled: false
  transport: tauri_ipc

conformance:
  fixtures:
    success: ../fixtures/google-books/success.json
    empty: ../fixtures/google-books/empty.json
    rate_limited: ../fixtures/google-books/rate-limited.json
    invalid_response: ../fixtures/google-books/invalid-response.json
  deterministic:
    - maps-volume-to-neutral-candidate
    - bounds-provider-credentials
    - declaration-deny-wins
    - rejects-non-public-dns-answers
  live_smoke: optional
