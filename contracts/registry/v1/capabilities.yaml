contract_version: 1.0.0
capability_base_uri: https://fasti.scrobble.dev/ns/capabilities/v1/

# Profiles keep repeated transport dispositions in one place. A required
# binding is a contract-generation target, not a claim that its runtime exists.
surface_profiles:
  health:
    domain_application:
      { state: required, binding: "application:{application_key}" }
    http_openapi: { state: required, binding: "openapi:{capability_id}" }
    sse_asyncapi:
      {
        state: not_applicable,
        reason: Health is a finite request and has no event stream.,
      }
    cli:
      {
        state: not_applicable,
        reason: Health is exposed as the process HTTP probe.,
      }
    json_schema: { state: required, binding: "schema:health-response" }
    json_ld:
      {
        state: not_applicable,
        reason: Operational health is not linked-data domain state.,
      }
    okf: { state: required, binding: "okf:capability-catalog" }
    sdk: { state: required, binding: "sdk:system.health" }
    knowledge:
      {
        state: not_applicable,
        reason: Healthy process state has no governed recovery problem.,
      }
    package_smoke:
      { state: required, binding: "package-smoke:production-health" }
    ui: { state: not_applicable, reason: Fasti is headless through B3. }

  b1_http_fixture:
    domain_application:
      { state: required, binding: "application:{application_key}" }
    http_openapi: { state: required, binding: "openapi:{capability_id}" }
    sse_asyncapi:
      {
        state: not_applicable,
        reason: This capability has no server-sent event channel.,
      }
    cli: { state: required, binding: "cli:capability-discovery" }
    json_schema:
      { state: required, binding: "schema:openapi-operation:{capability_id}" }
    json_ld:
      {
        state: not_applicable,
        reason: Operational access and administration are not linked-data domain state.,
      }
    okf: { state: required, binding: "okf:capability-catalog" }
    sdk: { state: required, binding: "sdk:{capability_id}" }
    knowledge: { state: required, binding: "knowledge:problem-catalog" }
    package_smoke:
      { state: required, binding: "package-smoke:b1-conformance-fixture" }
    ui: { state: not_applicable, reason: Fasti is headless through B3. }

  b1_observation_accept:
    domain_application:
      { state: required, binding: "application:{application_key}" }
    http_openapi: { state: required, binding: "openapi:{capability_id}" }
    sse_asyncapi:
      {
        state: not_applicable,
        reason: Observation acceptance is a finite mutation with no event channel.,
      }
    cli: { state: required, binding: "cli:capability-discovery" }
    json_schema:
      { state: required, binding: "schema:openapi-operation:{capability_id}" }
    json_ld: { state: required, binding: "json-ld:observation-receipt" }
    okf: { state: required, binding: "okf:capability-catalog" }
    sdk: { state: required, binding: "sdk:{capability_id}" }
    knowledge: { state: required, binding: "knowledge:problem-catalog" }
    package_smoke:
      { state: required, binding: "package-smoke:b1-conformance-fixture" }
    ui: { state: not_applicable, reason: Fasti is headless through B3. }

  b1_receipt_replay:
    domain_application:
      { state: required, binding: "application:{application_key}" }
    http_openapi: { state: required, binding: "openapi:{capability_id}" }
    sse_asyncapi:
      {
        state: not_applicable,
        reason: Receipt replay is a finite lookup rather than an event stream.,
      }
    cli: { state: required, binding: "cli:capability-discovery" }
    json_schema:
      { state: required, binding: "schema:openapi-operation:{capability_id}" }
    json_ld: { state: required, binding: "json-ld:observation-receipt" }
    okf: { state: required, binding: "okf:capability-catalog" }
    sdk: { state: required, binding: "sdk:{capability_id}" }
    knowledge: { state: required, binding: "knowledge:problem-catalog" }
    package_smoke:
      { state: required, binding: "package-smoke:b1-conformance-fixture" }
    ui: { state: not_applicable, reason: Fasti is headless through B3. }

  b1_receipt_stream:
    domain_application:
      { state: required, binding: "application:{application_key}" }
    http_openapi:
      {
        state: not_applicable,
        reason: The transport operation is governed by AsyncAPI rather than the finite HTTP API contract.,
      }
    sse_asyncapi: { state: required, binding: "asyncapi:{capability_id}" }
    cli: { state: required, binding: "cli:capability-discovery" }
    json_schema:
      { state: required, binding: "schema:asyncapi-message:receiptCommitted" }
    json_ld:
      {
        state: not_applicable,
        reason: Receipt stream events are transport envelopes governed by AsyncAPI; their referenced receipt semantics reuse the observation receipt contract rather than a second linked-data class.,
      }
    okf: { state: required, binding: "okf:capability-catalog" }
    sdk: { state: required, binding: "sdk:{capability_id}" }
    knowledge: { state: required, binding: "knowledge:problem-catalog" }
    package_smoke:
      { state: required, binding: "package-smoke:b1-conformance-fixture" }
    ui: { state: not_applicable, reason: Fasti is headless through B3. }

  later_b2:
    domain_application:
      { state: required, binding: "application:{application_key}" }
    http_openapi:
      {
        state: later_body,
        body: b2,
        reason: Request and response semantics belong to B2.,
      }
    sse_asyncapi:
      {
        state: later_body,
        body: b2,
        reason: Event applicability and semantics belong to B2.,
      }
    cli:
      { state: later_body, body: b2, reason: Command behavior belongs to B2. }
    json_schema:
      { state: later_body, body: b2, reason: Public data shapes belong to B2. }
    json_ld:
      {
        state: later_body,
        body: b2,
        reason: Linked-data meaning belongs to B2.,
      }
    okf:
      { state: later_body, body: b2, reason: Knowledge meaning belongs to B2. }
    sdk:
      {
        state: later_body,
        body: b2,
        reason: Generated client behavior belongs to B2.,
      }
    knowledge:
      { state: later_body, body: b2, reason: Recovery knowledge belongs to B2. }
    package_smoke:
      {
        state: later_body,
        body: b2,
        reason: Executable package evidence belongs to B2.,
      }
    ui: { state: not_applicable, reason: Fasti is headless through B3. }

  later_b3:
    domain_application:
      { state: required, binding: "application:{application_key}" }
    http_openapi:
      {
        state: later_body,
        body: b3,
        reason: Request and response semantics belong to B3.,
      }
    sse_asyncapi:
      {
        state: later_body,
        body: b3,
        reason: Event applicability and semantics belong to B3.,
      }
    cli:
      {
        state: later_body,
        body: b3,
        reason: Successful command behavior belongs to B3.,
      }
    json_schema:
      { state: later_body, body: b3, reason: Public data shapes belong to B3. }
    json_ld:
      {
        state: later_body,
        body: b3,
        reason: Linked-data meaning belongs to B3.,
      }
    okf:
      { state: later_body, body: b3, reason: Knowledge meaning belongs to B3. }
    sdk:
      {
        state: later_body,
        body: b3,
        reason: Generated client behavior belongs to B3.,
      }
    knowledge:
      { state: later_body, body: b3, reason: Recovery knowledge belongs to B3. }
    package_smoke:
      {
        state: later_body,
        body: b3,
        reason: Executable package evidence belongs to B3.,
      }
    ui: { state: not_applicable, reason: Fasti is headless through B3. }

capabilities:
  - application_key: system_health
    id: system.health
    bounded_context: system.operations
    contract_body: b1
    runtime_body: b0
    authorization: unauthenticated
    lifecycle:
      {
        introduced_in: b0,
        contract_state: finalized,
        runtime_availability: implemented,
      }
    surface_profile: health
    scopes: []
    problems: []
    examples: [system.health.success]
    uat: []

  - application_key: discover_capabilities
    id: system.capabilities.discover
    bounded_context: system.contracts
    contract_body: b1
    runtime_body: b1
    authorization: scoped
    lifecycle:
      {
        introduced_in: b1,
        contract_state: finalized,
        runtime_availability: fixture_only,
      }
    surface_profile: b1_http_fixture
    scopes: [capability_read]
    problems: [forbidden]
    examples: [system.capabilities.success, system.capabilities.forbidden]
    uat:
      - {
          id: ID-065,
          relationship: direct,
          owner_body: b1,
          reason: B1 owns executable capability discovery contract evidence.,
        }
      - {
          id: ID-078,
          relationship: split,
          owner_body: b2,
          reason: B1 binds registry knowledge links while identity-error recovery remains later.,
        }

  - application_key: initialize_node
