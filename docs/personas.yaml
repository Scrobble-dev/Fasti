version: 1
source: tests/conformance/identity-uat-matrix.v1.csv
tracks:
  - id: use
    label: Use Fasti
    outcome: Understand and keep portable media activity without giving one provider ownership of identity.
  - id: operate
    label: Operate and recover
    outcome: Run a bounded local node and understand its trust, durability, recovery, and support limits.
  - id: integrate
    label: Integrate and automate
    outcome: Build a client or connection that uses governed contracts, scopes, idempotency, and typed problems.
  - id: extend
    label: Map and extend
    outcome: Add provider, mapping, namespace, or custom-type behavior without redefining Fasti domain rules.
  - id: contribute
    label: Contribute and verify
    outcome: Change Fasti through its owned layers and provide exact-source test and review evidence.
personas:
  - id: anime_mapper
    track: extend
    outcome: Maintain explicit episode and series mappings without hiding ambiguous or partial coverage.
    first_task: /extend/first-provider/
    recovery_task: /integrate/problems/
    capability_ids: [system.capabilities.discover]
    uat_rows: [IDF-031, IDF-032, IDF-033, IDF-034, IDF-035, IDF-036, IDF-037, IDF-038, IDF-039, IDF-040, IDF-042, IDF-043, IDF-044, IDF-045, IDF-046]
    cross_cutting: false
  - id: anime_specialist
    track: extend
    outcome: Preserve anime numbering, editions, and identity evidence when one automatic mapping is unsafe.
    first_task: /extend/first-provider/
    recovery_task: /integrate/problems/
    capability_ids: [system.capabilities.discover]
    uat_rows: [IDF-016, IDF-017, IDF-018, IDF-019, IDF-053, IDF-054, IDF-055]
    cross_cutting: false
  - id: api_developer
    track: integrate
    outcome: Use exact HTTP operations, typed problems, and stable identifiers without guessing runtime availability.
    first_task: /integrate/first-observation/
    recovery_task: /integrate/problems/
    capability_ids: [observation.accept, system.capabilities.discover]
    uat_rows: [IDF-014, IDF-028, IDF-029, IDF-081, IDF-124]
    cross_cutting: false
  - id: audhd_user
