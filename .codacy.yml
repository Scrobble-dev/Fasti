---
# Codacy Configuration for Fasti
# Ref: https://docs.codacy.com/repositories-configure/codacy-configuration-file/

engines:
  agentlinter:
    exclude_paths:
      # security@scrobble.dev is the intentional, required public reporting
      # contact in our security policy -- not a PII leak.
      - "SECURITY.md"
  duplication:
    exclude_paths:
      - "contracts/generated/**"
      - "packages/sdk/src/generated/**"
      - "target/**"
      - "benchmarks/b1/fixtures/**"
      - "brand/assets/**"
      - "apps/desktop/src-tauri/gen/**"
      - "tests/fixtures/**"
  clippy:
    enabled: true
    exclude_paths:
      - "target/**"
      - "contracts/generated/**"
  eslint:
    enabled: true
    exclude_paths:
      - "packages/sdk/src/generated/**"
      - "target/**"
      - "dist/**"
      - "node_modules/**"
  shellcheck:
    enabled: true
  markdownlint:
    enabled: true
    exclude_paths:
      - "contracts/generated/**"
  remark-lint:
    enabled: true
    exclude_paths:
      - "contracts/generated/**"
  stylelint:
    enabled: true
  trivy:
    enabled: true
    exclude_paths:
      - "benchmarks/b1/fixtures/**"

languages:
  rust:
    exclude_paths:
      - "contracts/generated/**"
      - "target/**"
  typescript:
    exclude_paths:
      - "packages/sdk/src/generated/**"
      - "dist/**"
  javascript:
    exclude_paths:
      - "dist/**"
  markdown:
    exclude_paths:
      - "contracts/generated/**"

exclude_paths:
  - "contracts/generated/**"
  - "packages/sdk/src/generated/**"
  - "target/**"
  - "benchmarks/b1/fixtures/**"
  - "brand/assets/**"
  - "apps/desktop/src-tauri/gen/**"
  - "tests/fixtures/**"
  - "pnpm-lock.yaml"
  - "Cargo.lock"
  # Same lockfile-scanning exclusion as the workspace root's Cargo.lock above.
  # Tauri 2's GTK3 stack pins glib 0.18.5 (GHSA-wrw7-89jp-8q8g / RUSTSEC-2024-0429);
  # already tracked and accepted as an upstream-only risk in
  # .github/workflows/security.yml's `cargo audit --ignore RUSTSEC-2024-0429` step.
  # Re-evaluate together when Tauri 2 bumps its glib dependency to >=0.20.
  - "apps/desktop/src-tauri/Cargo.lock"
  # Codacy's hosted scanner runs its own bundled ruleset and does not honor
  # this repo's local eslint-disable comments, so it re-flags the
  # semver.org-vetted, linear-time regex in generate-release-notes.mjs as
  # "Unsafe Regular Expression" on every scan of a base branch that has
  # never seen this file before (already reviewed and suppressed for the
  # project's own ESLint run -- see the eslint-disable-next-line comment at
  # that line). Three prior attempts to suppress this narrowly all failed on
  # exactly that scenario: a rule-ID-scoped nosemgrep, a bare nosemgrep, and
  # an engines.eslint-scoped exclude_paths entry (which did clear the
  # finding on direct pushes to dev, but not on a PR comparing against the
  # long-diverged release branch, where this file has no history at all).
  # Only this top-level exclude -- the same mechanism already proven to work
  # for apps/desktop/src-tauri/Cargo.lock in the identical circumstance --
  # reliably suppresses it regardless of comparison base.
  - "scripts/generate-release-notes.mjs"
