# cargo-deny configuration: final security review gate for B8b.
#
# The allow-list below is exactly the set of licenses present across both
# lockfiles this gate checks (the main workspace and the isolated Tauri
# benchmark shell's lockfile, verified via `cargo metadata` on each), plus a
# small number of common permissive licenses a future dependency might
# reasonably carry. All are compatible with distributing Fasti under
# AGPL-3.0-or-later (see NOTICE) as a dependency, not as a derivative of
# Fasti itself. MPL-2.0 is weak-copyleft (file-level, not project-level) and
# is used only as a library dependency here (cssparser/selectors/dtoa-short/
# option-ext, transitive via the Tauri benchmark shell's wry/webkit stack).

[graph]
targets = []

[licenses]
version = 2
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2025-0098: unic-ucd-version (transitive: urlpattern ->
    # tauri-utils -> tauri, isolated Tauri benchmark shell lockfile only).
    # The whole rust-unic project is archived upstream; no safe upgrade
    # exists. Tracked as a known gap in
    # docs/architecture/b8b-release-readiness.md and SECURITY.md rather than
    # silently passed -- ignoring it here only stops it from failing this
    # specific gate, it does not resolve the underlying advisory.
    "RUSTSEC-2025-0098",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
