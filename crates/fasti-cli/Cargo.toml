[package]
name = "fasti-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Command-line administrative shell for explicitly gated Fasti operations"

[[bin]]
name = "fasti"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
chrono = { workspace = true }
fasti-application = { workspace = true }
fasti-api = { workspace = true }
fasti-contracts = { workspace = true }
fasti-store = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["termios"] }
