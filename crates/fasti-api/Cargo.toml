[package]
name = "fasti-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "HTTP REST API routes, handlers, and JSON contracts for Fasti"

[dependencies]
axum = { workspace = true }
fasti-application = { workspace = true }
fasti-contracts = { workspace = true }
fasti-domain = { workspace = true }
getrandom = { workspace = true, optional = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", optional = true }
utoipa = { workspace = true }

[features]
default = []
conformance-fixture = [
  "dep:getrandom",
  "dep:tokio-stream",
  "fasti-application/conformance-fixture",
]

[[bin]]
name = "b1-conformance-server"
path = "src/bin/b1-conformance-server.rs"
required-features = ["conformance-fixture"]

[dev-dependencies]
fasti-store = { workspace = true }
serde = { workspace = true }
static_assertions = { workspace = true }
tempfile = "3.27.0"
tokio = { workspace = true }
tower = { workspace = true }
