name: Feature Proposal
description: Propose a new capability, connector, or interface enhancement
title: "feat: [Concise feature title]"
labels: ["enhancement", "proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What specific personal media workflow or limitation does this address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Approach
      description: How should Fasti address this while preserving local-first durability?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
