name: Replication Design / Conformance Issue
description: Capture an accepted replication invariant or fixture issue before a replication product exists
title: "replication: [Brief invariant or fixture issue]"
labels: ["replication-design", "conformance"]
body:
  - type: markdown
    attributes:
      value: "Fasti has no replication service or hidden offline mutation queue. Begin proposals in Discussions. Use this form only after scope alignment for a neutral invariant or governed conformance fixture."
  - type: input
    id: discussion
    attributes:
      label: Prior Discussion URL
      description: Link the Discussion where the boundary and evidence were aligned.
      placeholder: "https://github.com/Scrobble-dev/Fasti/discussions/..."
    validations:
      required: true
  - type: textarea
    id: sequence_behavior
    attributes:
      label: Required Invariant or Fixture Defect
      placeholder: "Describe duplicate delivery, cursor, ordering, conflict, or reconnect behavior without claiming a current implementation."
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sync Cursor / Log Output
      description: Use synthetic data and redact credentials, device identifiers, addresses, and personal media history.
      render: shell
