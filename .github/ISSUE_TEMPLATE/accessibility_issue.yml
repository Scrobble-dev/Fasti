name: Accessibility Problem
description: Report a keyboard trap, screen reader gap, touch target violation, or cognitive friction
title: "a11y: [Summary of accessibility barrier]"
labels: ["accessibility", "ux"]
body:
  - type: markdown
    attributes:
      value: "Fasti holds a strict WCAG 2.2 AA and cognitive accessibility standard. B0 has no product UI; report barriers in the current README, brand preview, or repository surfaces here. Discuss future product UI before implementation."
  - type: input
    id: surface
    attributes:
      label: Affected surface and commit
      description: Name the current surface and include the commit SHA or URL you tested.
      placeholder: "brand/preview.html at 8fc8173"
    validations:
      required: true
  - type: dropdown
    id: barrier_type
    attributes:
      label: Barrier Category
      options:
        - "Keyboard Navigation / Focus Trap"
        - "Screen Reader (VoiceOver, NVDA, JAWS)"
        - "Touch Target Size (< 44px)"
        - "Color Contrast / Legibility"
        - "Motion Sensitivity / prefers-reduced-motion"
        - "Cognitive / Executive Function Friction"
    validations:
      required: true
  - type: textarea
    id: barrier_details
    attributes:
      label: Description of Barrier & Assistive Tech
      placeholder: "Describe the element, the assistive tech used, and the barrier experienced."
    validations:
      required: true
  - type: checkboxes
    id: future_ui_discussion
    attributes:
      label: Future UI work
      options:
        - label: If this proposes a new product UI or interaction, I opened a Discussion before implementation.
