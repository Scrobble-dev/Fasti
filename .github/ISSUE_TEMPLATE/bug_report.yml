name: Bug Report
description: Report a reproducible bug or unexpected behavior in Fasti
title: "fix: [Short summary of the bug]"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Fasti has no supported public release yet. Report reproducible behavior from a named commit or local OCI image; use Discussions for planned capabilities."
  - type: input
    id: version
    attributes:
      label: Fasti Version / Commit
      description: What version of Fasti or commit SHA were you running?
      placeholder: "e.g. commit 8fc8173 or local image digest sha256:..."
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - "fastid health-only daemon"
        - "fasti guarded CLI"
        - "Rust workspace scaffold"
        - "Retained TypeScript packages"
        - "Governed contract drafts / fixtures"
        - "Local daemon-and-CLI OCI image"
        - "Documentation / workflow policy"
        - "Brand preview / design assets"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating System / Deployment
      options:
        - "Local Docker / Podman image"
        - "Linux source checkout"
        - "macOS source checkout"
        - "Windows / WSL2 source checkout"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Explain step-by-step how to trigger the issue.
      placeholder: "1. Check out commit...\n2. Run the exact command...\n3. Observe the error and exit status..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: "What should have happened according to data invariants?"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Error Output
      description: Please sanitize private credentials, tokens, or IP addresses before submitting.
      render: shell
