name: Import / Migration Issue
description: Report data loss, incorrect timestamp mapping, or failure during history migration
title: "import: [Source system name] migration issue"
labels: ["importer", "data-integrity"]
body:
  - type: markdown
    attributes:
      value: "Fasti prioritizes lossless history migration. If an import corrupted timestamps or dropped rewatch counts, let us know!"
  - type: dropdown
    id: source
    attributes:
      label: Originating Source
      options:
        - "Floppy"
        - "Trakt.tv"
        - "Letterboxd"
        - "Last.fm"
        - "Plex"
        - "Jellyfin"
        - "Custom Export"
    validations:
      required: true
  - type: textarea
    id: issue_details
    attributes:
      label: Discrepancy Description
      description: What specific fields or timestamps were lost, mapped incorrectly, or duplicated?
      placeholder: "e.g. Letterboxd rewatch entries on 2024-05-12 were collapsed into a single watch event."
    validations:
      required: true
  - type: textarea
    id: sanitized_sample
    attributes:
      label: Sanitized Sample Input
      description: A small JSON or CSV snippet demonstrating the failing structure (remove private names).
      render: json
