name: Source-Shape Fixture / Migration Design Issue
description: Report a defect in a governed migration fixture or discuss evidence mapping before import capabilities exist
title: "fixture: [Source shape] mapping issue"
labels: ["fixtures", "data-integrity"]
body:
  - type: markdown
    attributes:
      value: "No production importer exists. Begin adapter or migration proposals in Discussions. Use this form only for a reproducible defect in a governed source-shape fixture or accepted conformance case; it makes no compatibility claim."
  - type: input
    id: discussion
    attributes:
      label: Prior Discussion URL
      description: Link the scope-alignment Discussion for this source shape.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source Shape and Fixture Version
      placeholder: "e.g. synthetic Yamtrack-shaped history v1; not a compatibility claim"
    validations:
      required: true
  - type: textarea
    id: issue_details
    attributes:
      label: Discrepancy Description
      description: What evidence, grain, timestamp, duplicate, or loss expectation in the governed fixture is wrong?
      placeholder: "e.g. Letterboxd rewatch entries on 2024-05-12 were collapsed into a single watch event."
    validations:
      required: true
  - type: textarea
    id: sanitized_sample
    attributes:
      label: Sanitized Sample Input
      description: A minimal synthetic JSON or CSV snippet. Remove names, credentials, identifiers, and personal media history.
      render: json
