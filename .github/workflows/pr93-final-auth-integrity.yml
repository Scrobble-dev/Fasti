name: PR 93 final auth integrity

on:
  push:
    branches:
      - feat/floppy-allauth-sessions

permissions:
  contents: write

concurrency:
  group: pr-93-final-auth-integrity
  cancel-in-progress: false

jobs:
  finalize:
    name: Repair and verify account security state
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: feat/floppy-allauth-sessions

      - name: Apply the bounded repair
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()

          def remove_struct(source: str, name: str) -> str:
              marker = f"pub struct {name}"
              at = source.find(marker)
              if at < 0:
                  return source
              start = source.rfind("\n\n", 0, at)
              start = 0 if start < 0 else start + 2
              brace = source.find("{", at)
              if brace < 0:
                  raise SystemExit(f"opening brace not found for {name}")
              depth = 0
              end = None
              for index in range(brace, len(source)):
                  if source[index] == "{":
                      depth += 1
                  elif source[index] == "}":
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          break
              if end is None:
                  raise SystemExit(f"closing brace not found for {name}")
              while end < len(source) and source[end] == "\n":
                  end += 1
              return source[:start] + source[end:]

          contracts = root / "crates/fasti-contracts/src/browser_auth.rs"
          source = contracts.read_text()
          source = remove_struct(source, "WebAuthnPasskeyDto")
          source = remove_struct(source, "MfaStatusResponse")
          source = re.sub(
              r"\nfn serialize_not_recorded<S>\(.*?\n\}\n",
              "\n",
              source,
              flags=re.S,
          )
          source = source.replace('    #[serde(serialize_with = "serialize_not_recorded")]\n', "")
          source = re.sub(
              r"#\[derive\(Debug, Clone, PartialEq, Eq, Serialize, JsonSchema, ToSchema\)\]\n"
              r"#\[serde\(deny_unknown_fields\)\]\n"
              r"pub struct SwitchProfileRequest \{\n    pub profile_id: String,\n\}\n\n"
              r"impl<'de> Deserialize<'de> for SwitchProfileRequest \{.*?\n\}\n",
              "#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize, JsonSchema, ToSchema)]\n"
              "#[serde(deny_unknown_fields)]\n"
              "pub struct SwitchProfileRequest {\n    pub profile_id: String,\n}\n",
              source,
              flags=re.S,
          )
          source = re.sub(
              r"\n    #\[test\]\n    fn session_metadata_does_not_claim_unrecorded_values\(\) \{.*?\n    \}\n",
              "\n",
              source,
              flags=re.S,
          )
          source = re.sub(
              r"\n    #\[test\]\n    fn profile_switch_request_is_rejected_until_it_is_session_scoped\(\) \{.*?\n    \}\n",
              "\n",
              source,
              flags=re.S,
          )
          contracts.write_text(source)

          application = root / "crates/fasti-application/src/browser_auth.rs"
          source = application.read_text()
          start = source.find("impl BrowserSessionSummary {")
          end = source.find("\npub struct ListBrowserSessionsQuery", start)
          if start < 0 or end < 0:
              raise SystemExit("BrowserSessionSummary boundary not found")
          block = source[start:end]
          block = block.replace(
              "        location: String,\n        device_type: String,\n",
              "        _location: String,\n        _device_type: String,\n",
              1,
          )
          block = block.replace(
              "            location,\n            device_type,\n",
              '            location: "Not recorded".to_owned(),\n'
              '            device_type: "Not recorded".to_owned(),\n',
              1,
          )
          source = source[:start] + block + source[end:]
          test_name = "session_summary_does_not_invent_unrecorded_metadata"
          if test_name not in source:
              source += '''

#[cfg(test)]
mod session_inventory_tests {
    use super::*;

    #[test]
    fn session_summary_does_not_invent_unrecorded_metadata() {
        let observed_at = Utc::now();
        let summary = BrowserSessionSummary::new(
            "sess_0123456789ab".to_owned(),
            observed_at,
            observed_at,
            observed_at,
            "Local Host (127.0.0.1)".to_owned(),
            "Desktop Browser (Workbench)".to_owned(),
            true,
        );

        assert_eq!(summary.location(), "Not recorded");
        assert_eq!(summary.device_type(), "Not recorded");
    }
}
'''
          application.write_text(source)

          store = root / "crates/fasti-store/src/browser_auth.rs"
          source = store.read_text()
          source = source.replace(
              '"Local Host (127.0.0.1)".to_string(),\n'
              '                "Desktop Browser (Workbench)".to_string(),',
              '"Not recorded".to_string(),\n'
              '                "Not recorded".to_string(),',
          )
          auth_start = source.find("fn authenticate_session(")
          auth_end = source.find("\nimpl BrowserAccountPort for SqliteKernel", auth_start)
          if auth_start < 0 or auth_end < 0:
              raise SystemExit("authenticate_session boundary not found")
          auth_block = source[auth_start:auth_end]
          if "UPDATE browser_sessions SET last_seen_at" not in auth_block:
              needle = "    Ok(AuthenticatedBrowserSession::new(\n"
              insert_at = auth_block.rfind(needle)
              if insert_at < 0:
                  raise SystemExit("authenticated session return not found")
              update = '''    let seen_at = now();
    let update_before = timestamp(seen_at - Duration::minutes(1));
    map_sql(
        connection.execute(
            "UPDATE browser_sessions SET last_seen_at = ?1 WHERE session_digest = ?2 AND last_seen_at < ?3",
            params![timestamp(seen_at), session_digest, update_before],
        ),
        capability,
        correlation_id,
    )?;
'''
              auth_block = auth_block[:insert_at] + update + auth_block[insert_at:]
              source = source[:auth_start] + auth_block + source[auth_end:]

          switch_start = source.find("    fn switch_browser_session_profile(")
          switch_end = source.find("\n    fn list_browser_users(", switch_start)
          if switch_start < 0 or switch_end < 0:
              raise SystemExit("profile switch boundary not found")
          switch_block = source[switch_start:switch_end]
          if "profile switching remains unavailable" not in switch_block:
              replacement = '''    fn switch_browser_session_profile(
        &self,
        command: SwitchBrowserSessionProfileCommand,
    ) -> ApplicationResult<AuthenticatedBrowserSession> {
        let capability = CapabilityKey::ReadBrowserSession;
        let (correlation_id, _, _, _) = command.into_parts();
        // Profile selection must be scoped to one browser session. Updating the
        // browser user would change every active session and could create an
        // authorization grant as a side effect. Keep this capability closed
        // until the access model owns a session-scoped profile selection.
        Err(problem(
            ProblemCode::ValidationFailed,
            capability,
            correlation_id,
        ))
    }
'''
              source = source[:switch_start] + replacement + source[switch_end:]
          store.write_text(source)

          auth_doc = root / "docs/architecture/authentication.md"
          source = auth_doc.read_text()
          heading = "## Browser account sessions"
          if heading not in source:
              source += '''

## Browser account sessions

The account dialog uses access-owned browser sessions. Password sign-in,
session inventory, current or other-session revocation, and administrator-owned
browser-user changes use the real host and server contracts.

The inventory reports location and device as `Not recorded` until a real request
metadata contract exists. It does not infer these values. Profile switching
stays unavailable until profile selection belongs to one session and cannot
create an authorization grant as a side effect.

Passkey, OIDC, and device authorization stay visible with a precise unavailable
state. The UI does not create TOTP secrets, PINs, local profiles, credentials, or
success state in browser storage.

Session inventory and revocation are synchronous HTTP capabilities in OpenAPI.
They publish no event, so AsyncAPI does not change. Browser-session security
state is not linked domain data, so JSON-LD does not apply.

Retained UI evidence: [`../quality/auth-account-accessibility-evidence.md`](../quality/auth-account-accessibility-evidence.md).
'''
          auth_doc.write_text(source)

          for workflow in (
              root / ".github/workflows/pr93-source-snapshot.yml",
              root / ".github/workflows/pr93-final-auth-integrity.yml",
          ):
              if workflow.exists():
                  workflow.unlink()
          PY

          test ! -e .github/workflows/pr93-source-snapshot.yml
          test ! -e .github/workflows/pr93-final-auth-integrity.yml
          ! grep -R "MfaStatusResponse\|WebAuthnPasskeyDto" crates/fasti-contracts/src/browser_auth.rs
          grep -q 'location: "Not recorded".to_owned()' crates/fasti-application/src/browser_auth.rs
          grep -q 'UPDATE browser_sessions SET last_seen_at' crates/fasti-store/src/browser_auth.rs
          grep -q 'profile switching remains unavailable' crates/fasti-store/src/browser_auth.rs
          ! grep -q '"Local Host (127.0.0.1)".to_string()' crates/fasti-store/src/browser_auth.rs
          git diff --check

      - name: Verify Rust and generated contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy -p fasti-application -p fasti-contracts -p fasti-store -p fasti-api --all-targets --all-features -- -D warnings
          cargo test -p fasti-application -p fasti-contracts -p fasti-store -p fasti-api
          cargo xtask contract verify

      - name: Verify the frontend
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm lint:ui
          pnpm build
          pnpm test:ui
          pnpm audit --prod --audit-level high

      - name: Commit the verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ryan Winkler"
          git config user.email "28455297+ryan-winkler@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -s -m "fix(auth): keep account security state truthful" \
            -m "Record real session activity, report unavailable client metadata as not recorded, and keep profile switching closed until it has a session-scoped authorization model. Remove unused MFA contract shapes and update the authentication boundary documentation."
          git push origin "HEAD:${GITHUB_REF_NAME}"
