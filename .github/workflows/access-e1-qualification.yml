name: Access E1 qualification

on:
  push:
    branches: ["dev"]
    paths:
      - ".github/workflows/access-e1-qualification.yml"
      - "qualification/access-e1/**"
  pull_request:
    branches: ["dev"]
    paths:
      - ".github/workflows/access-e1-qualification.yml"
      - "qualification/access-e1/**"

permissions:
  contents: read

jobs:
  qualification:
    name: OIDC library qualification (not runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - name: Fetch the isolated locked graph
        run: cargo fetch --locked --manifest-path qualification/access-e1/Cargo.toml
      - name: Check formatting
        run: cargo fmt --manifest-path qualification/access-e1/Cargo.toml -- --check
      - name: Run the complete offline library suite
        run: |
          set -euo pipefail
          qualification_log="$(mktemp)"
          cargo test --offline --locked --manifest-path qualification/access-e1/Cargo.toml 2>&1 | tee "$qualification_log"
          test "$(grep -c '^test result:' "$qualification_log")" -eq 1
          grep -Eq '^test result: ok\. 20 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;' "$qualification_log"
      - name: Deny compiler warnings
        run: cargo clippy --offline --locked --manifest-path qualification/access-e1/Cargo.toml --all-targets -- -D warnings

  advisories:
    name: OIDC qualification dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@f347db2dee5edb1a4bddcbed2220c6e7828a0fad # cargo-audit
        with:
          tool: cargo-audit
      - name: Audit the isolated lockfile without suppression
        run: cargo audit --file qualification/access-e1/Cargo.lock
