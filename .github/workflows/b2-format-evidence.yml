name: B2 Rust Formatting Evidence

on:
  push:
    branches:
      - "security/b1-evidence-hardening-20260822"

permissions:
  contents: read

jobs:
  rustfmt-patch:
    name: Produce exact rustfmt patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt
      - name: Format the workspace and capture the exact change
        run: |
          cargo fmt --all
          git diff --binary > b2-rustfmt.patch
          test -s b2-rustfmt.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: b2-rustfmt-patch
          path: b2-rustfmt.patch
          if-no-files-found: error
          retention-days: 1
