name: Cache PR 93 audited dependencies

on:
  push:
    branches:
      - automation/pr93-dependency-cache-20260829

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact cache branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Resolve and compile Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo check --workspace --all-targets
          mkdir -p .cargo
          cargo vendor --locked --versioned-dirs vendor > .cargo/vendor-sources.toml
          tar --zstd -cf cargo-vendor.tar.zst \
            Cargo.lock vendor .cargo/vendor-sources.toml

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: 22

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.1.0
        with:
          version: 11.22.0
          run_install: false

      - name: Resolve and install pnpm graph
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --store-dir .pnpm-store
          npm pack pnpm@11.22.0 --pack-destination .
          find . -path '*/node_modules' -type d -prune -print0 > node-modules.paths
          tar --null --files-from=node-modules.paths --zstd -cf pnpm-installed.tar.zst
          tar --zstd -rf pnpm-installed.tar.zst pnpm-11.22.0.tgz

      - name: Upload Rust dependency cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr93-cargo-vendor
          path: cargo-vendor.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload installed pnpm graph
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr93-pnpm-installed
          path: pnpm-installed.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
