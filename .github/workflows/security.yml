name: Security Audit

on:
  push:
    branches: ["dev", "release"]
  pull_request:
    branches: ["dev", "release"]
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sundays

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Rust Security Advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install cargo-audit
        uses: taiki-e/install-action@f347db2dee5edb1a4bddcbed2220c6e7828a0fad # cargo-audit
      - name: Audit workspace lockfile
        run: cargo audit --file Cargo.lock
      - name: Audit isolated Tauri benchmark lockfile
        run: cargo audit --file benchmarks/b1/tauri-shell/src-tauri/Cargo.lock
      - name: Audit desktop Tauri lockfile
        # Tauri 2's GTK3 stack pins glib 0.18.5, affected by RUSTSEC-2024-0429
        # (unsound VariantStrIter iteration). Fasti's own desktop code has no
        # direct glib:: calls (verified: no VariantStrIter/glib:: references
        # under apps/desktop/src-tauri); the advisory's surface is only
        # reachable through Tauri's own internals, which are out of Fasti's
        # control until glib is bumped upstream. Keep every other advisory
        # fatal. Owner: desktop maintainer. Re-evaluate when Tauri 2 bumps its
        # glib dependency to >=0.20, or at the next desktop dependency review.
        # Upstream migration: https://github.com/tauri-apps/tauri-docs/issues/3143
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock --ignore RUSTSEC-2024-0429
