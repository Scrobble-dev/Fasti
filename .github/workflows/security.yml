name: Security Audit

on:
  push:
    branches: ["dev", "release"]
  pull_request:
    branches: ["dev", "release"]
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sundays

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Rust Security Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Audit workspace lockfile
        run: cargo audit --file Cargo.lock
      - name: Audit isolated Tauri benchmark lockfile
        run: cargo audit --file benchmarks/b1/tauri-shell/src-tauri/Cargo.lock
