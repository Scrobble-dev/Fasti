name: Apply reviewed B1 finalization once

on:
  pull_request:
    branches:
      - "release"
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize-b1:
    if: github.event.pull_request.number == 14 && github.event.pull_request.head.ref == 'security/b1-evidence-hardening-20260822' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.22.0

      - name: Verify and apply the reviewed patches
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git log -1 --format=%s)" = "ci(repair): apply reviewed B1 finalization once"
          git merge-base --is-ancestor 1ebf3106b0d7af994dac7f0f1122be78e59c2e03 HEAD

          declare -A patches=(
            [finalize-b1.patch]=0be3e0f1f4f6a19b4c62ffd37843806653e07dd3
            [problem-lifecycle.patch]=811d0364b37f0793b60dd446666149da6519f679
            [problem-test.patch]=ceeacbcd3115b65c123a16cfff5eaae72a0d5fe6
            [conformance-cleanup.patch]=aaa1e0c29c496676cfa4cd66e38df5e57f78ce7b
            [receipt-shape.patch]=d64cce6ac4eb1088c2fcd8fc3c6126c22e6683c7
            [format.patch]=a796eda42288d4b92cbfb31f8ca05ec5d3a8f91e
          )

          git show 1ebf3106b0d7af994dac7f0f1122be78e59c2e03:.fasti-staging/finalize-b1.patch > /tmp/finalize-b1.patch
          git show 1ebf3106b0d7af994dac7f0f1122be78e59c2e03:.fasti-staging/finalize-b1-problem-lifecycle.patch > /tmp/problem-lifecycle.patch
          git show 1ebf3106b0d7af994dac7f0f1122be78e59c2e03:.fasti-staging/finalize-b1-problem-test.patch > /tmp/problem-test.patch
          git show 1ebf3106b0d7af994dac7f0f1122be78e59c2e03:.fasti-staging/finalize-b1-conformance.patch > /tmp/conformance-cleanup.patch
          git show 1ebf3106b0d7af994dac7f0f1122be78e59c2e03:.fasti-staging/finalize-b1-receipt-shape.patch > /tmp/receipt-shape.patch
          git show 1ebf3106b0d7af994dac7f0f1122be78e59c2e03:.fasti-staging/finalize-b1-format.patch > /tmp/format.patch

          for name in finalize-b1.patch problem-lifecycle.patch problem-test.patch conformance-cleanup.patch receipt-shape.patch format.patch; do
            actual="$(git hash-object "/tmp/$name")"
            expected="${patches[$name]}"
            if [[ "$actual" != "$expected" ]]; then
              echo "Patch identity mismatch for $name: expected $expected, got $actual" >&2
              exit 1
            fi
            git apply --check "/tmp/$name"
            git apply "/tmp/$name"
          done

          allowed='^(crates/fasti-application/src/(capabilities|problems|receipts)\.rs|crates/fasti-contracts/src/generated_capability_ids\.rs|crates/fasti-store/src/(evidence|observation|seed)\.rs|tests/js/sdk-client\.test\.mjs|xtask/src/registry\.rs)$'
          changed="$(git status --short | sed -E 's/^.. //')"
          test -n "$changed"
          while IFS= read -r path; do
            if [[ ! "$path" =~ $allowed ]]; then
              echo "Unexpected B1 finalization change: $path" >&2
              exit 1
            fi
          done <<< "$changed"

          git diff --check
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm typecheck
          cargo xtask contract verify --locked
          pnpm test

      - name: Commit the verified B1 finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ryan Winkler"
          git config user.email "28455297+ryan-winkler@users.noreply.github.com"
          git add \
            crates/fasti-application/src/capabilities.rs \
            crates/fasti-application/src/problems.rs \
            crates/fasti-application/src/receipts.rs \
            crates/fasti-contracts/src/generated_capability_ids.rs \
            crates/fasti-store/src/evidence.rs \
            crates/fasti-store/src/observation.rs \
            crates/fasti-store/src/seed.rs \
            tests/js/sdk-client.test.mjs \
            xtask/src/registry.rs
          git commit -s \
            -m "fix(b1): restore exact contract lifecycle and fixture parity" \
            -m "Keep the B1 HTTP and SSE behavior fixture-only, keep B2 identity and review capabilities reserved until their implementing body activates, and remove temporary public capability variants that duplicated existing application ownership." \
            -m "Keep B2 storage helpers available behind the owning observation and record capabilities without claiming a production route. Keep B2-only problems out of the public B1 registry, preserve the established optional receipt wire shape, align the validation text, and add bounded Rust fixture diagnostics." \
            -m "Rust lint, workspace tests, contract verification, TypeScript formatting and type checks, and the complete JavaScript contract and SDK suite passed before this commit. No product route, public listener, package, or release is added."
          git push origin HEAD:security/b1-evidence-hardening-20260822
