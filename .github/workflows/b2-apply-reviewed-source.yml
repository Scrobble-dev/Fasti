name: Apply reviewed B1 recovery

on:
  push:
    branches:
      - "security/b1-evidence-hardening-20260822"
  pull_request:
    branches:
      - "release"
    types:
      - synchronize

permissions:
  actions: read
  contents: write

concurrency:
  group: fasti-reviewed-b1-recovery
  cancel-in-progress: false

jobs:
  apply-reviewed-recovery:
    if: github.repository == 'Scrobble-dev/Fasti' && github.actor == 'ryan-winkler'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security/b1-evidence-hardening-20260822
          fetch-depth: 0

      - name: Verify the bounded recovery inputs
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: 24516cff2b67474475748a7a236c5b7a1cb5c6a7
          EXPECTED_PATCH_SHA256: 9dac751d73bb9dc9b403680f4259c1bb112ad47448e1ab7345ba43d9297853aa
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_SOURCE_SHA" HEAD
          git diff --name-only "$EXPECTED_SOURCE_SHA"..HEAD | LC_ALL=C sort > /tmp/changed-inputs.txt
          cat > /tmp/expected-inputs.txt <<'PATHS'
          .fasti-staging/finalize-b1.patch
          .github/workflows/b2-apply-reviewed-source.yml
          PATHS
          diff --unified /tmp/expected-inputs.txt /tmp/changed-inputs.txt
          cp .fasti-staging/finalize-b1.patch /tmp/finalize-b1.patch
          echo "$EXPECTED_PATCH_SHA256  /tmp/finalize-b1.patch" | sha256sum --check --strict

      - name: Download and verify the formatter-produced workspace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "9478689118"
          ARTIFACT_SHA256: e1dc2ffc60c4c53f0a79b8e2b5dfaba6b5b828db241bdfce2d8ca7f5d8c792ca
        run: |
          set -euo pipefail
          curl --fail-with-body --location --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/fasti-workspace.zip
          echo "$ARTIFACT_SHA256  /tmp/fasti-workspace.zip" | sha256sum --check --strict
          zipinfo -1 /tmp/fasti-workspace.zip | LC_ALL=C sort > /tmp/zip-paths.txt
          printf '%s\n' fasti-b2-workspace.patch fasti-b2-workspace.tar.gz | LC_ALL=C sort > /tmp/expected-zip-paths.txt
          diff --unified /tmp/expected-zip-paths.txt /tmp/zip-paths.txt
          mkdir -p /tmp/artifact
          unzip -q /tmp/fasti-workspace.zip -d /tmp/artifact
          mkdir -p /tmp/reviewed-workspace
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile

          source = Path('/tmp/artifact/fasti-b2-workspace.tar.gz')
          destination = Path('/tmp/reviewed-workspace')
          total = 0
          with tarfile.open(source, mode='r:gz') as archive:
              members = archive.getmembers()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f'unsupported archive member: {member.name}')
                  if member.size > 20 * 1024 * 1024:
                      raise SystemExit(f'oversized archive member: {member.name}')
                  total += member.size
              if total > 64 * 1024 * 1024:
                  raise SystemExit('reviewed workspace exceeds its bounded extraction limit')
              archive.extractall(destination, filter='data')
          PY

      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0

      - name: Restore the reviewed tree and remove recovery authority
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude=.git /tmp/reviewed-workspace/ ./
          git apply --check /tmp/finalize-b1.patch
          git apply /tmp/finalize-b1.patch
          rm -rf .fasti-staging
          rm -f .github/workflows/b2-apply-reviewed-source.yml
          rm -f .github/workflows/b2-diagnose-source.yml
          rm -f .github/workflows/b2-format-evidence.yml
          python3 - <<'PY'
          from pathlib import Path

          expected = '''name: CI

          on:
            push:
              branches: ["dev", "release"]
            pull_request:
              branches: ["dev", "release"]

          permissions:
            contents: read

          jobs:
            b1-portable-gate:
              name: Canonical B1 PR gate
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
                - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
                  with:
                    components: rustfmt, clippy
                - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
                - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
                  with:
                    node-version: 22
                - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
                  with:
                    version: 11.22.0
                - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
                  with:
                    python-version: "3.12"
                - name: Install locked Tauri Linux build prerequisites
                  run: |
                    sudo apt-get update
                    sudo apt-get install --yes --no-install-recommends \\
                      build-essential \\
                      curl \\
                      file \\
                      libayatana-appindicator3-dev \\
                      librsvg2-dev \\
                      libssl-dev \\
                      libwebkit2gtk-4.1-dev \\
                      libxdo-dev \\
                      wget
                - run: pnpm install --frozen-lockfile
                - name: Fetch both locked Rust dependency graphs
                  run: |
                    cargo fetch --locked
                    cargo fetch --manifest-path benchmarks/b1/tauri-shell/src-tauri/Cargo.toml --locked
                - name: Run governed contracts and portable benchmark sentinels
                  run: cargo xtask test pr

            rust:
              name: Rust workspace
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
                - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
                  with:
                    components: rustfmt, clippy
                - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
                - run: cargo metadata --locked --format-version 1 --no-deps
                - run: cargo fmt --all -- --check
                - run: cargo clippy --workspace --all-targets --locked -- -D warnings
                - run: cargo test --workspace --locked
                - run: cargo build --workspace --all-targets --locked

            javascript:
              name: Retained JavaScript packages
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
                - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
                  with:
                    node-version: 22
                - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
                  with:
                    version: 11.22.0
                - run: pnpm install --frozen-lockfile
                - run: pnpm format:check
                - run: pnpm typecheck
                - run: pnpm test

            repository-truth:
              name: B0 repository truth
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
                - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
                  with:
                    node-version: 22
                - run: bash scripts/check-repository-truth.sh
                - run: bash scripts/check-no-publish.sh
                - run: bash scripts/test-no-publish-policy.sh
                - run: node scripts/check-doc-links.mjs

            oci:
              name: Daemon and CLI OCI smoke
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
                - name: Build strict OCI image
                  run: docker build --tag fasti:b0 .
                - name: Verify non-root, health, false-success, and idle-memory gates
                  run: bash scripts/smoke-oci.sh fasti:b0
          '''
          lines = expected.splitlines()
          normalized = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines).lstrip('\n') + '\n'
          Path('.github/workflows/ci.yml').write_text(normalized, encoding='utf-8')
          PY
          echo "3d33f68460f14a53cbcd22f74e851d6a1f63be8bd407c4fa83445d9ad517d747  .github/workflows/ci.yml" | sha256sum --check --strict
          git diff --check

      - name: Verify the repaired source before commit
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo fmt --all -- --check
          cargo test --workspace --locked
          pnpm format:check
          pnpm typecheck
          pnpm test
          bash scripts/check-repository-truth.sh
          bash scripts/check-no-publish.sh
          bash scripts/test-no-publish-policy.sh
          node scripts/check-doc-links.mjs

      - name: Commit the reviewed repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ryan Winkler"
          git config user.email "28455297+ryan-winkler@users.noreply.github.com"
          git add -A
          git commit -s \
            -m "fix(b1): restore governed capability truth and CI" \
            -m "Restore B1 lifecycle, authorization, scope, and problem metadata to the checked-in capability registry. This prevents first-client enrollment from entering the wrong authorization path and then terminating the loopback fixture while constructing an undeclared problem." \
            -m "Keep the partial B2 storage work behind existing owning operations: evidence upload remains part of observation acceptance, and provider-neutral identity seed application reuses record creation instead of adding unregistered public capabilities." \
            -m "Reconcile Cargo.lock, apply the pinned formatter to the workspace, remove the corrupted staged archive and all write-enabled recovery workflows, restore read-only CI permissions, and add bounded Rust fixture stderr and exit diagnostics for future failures." \
            -m "Validated before commit with locked Rust workspace tests, JavaScript formatting/type/contract/SDK tests, repository truth, no-publish mutation tests, and documentation-link checks. Product UI remains absent, so screenshots and visual accessibility review are not applicable to this repair."
          git push origin HEAD:security/b1-evidence-hardening-20260822
