name: OpenSSF Scorecard Supply-Chain Security

on:
  schedule:
    - cron: "30 1 * * 1" # Mondays at 01:30 UTC
  push:
    branches: ["dev"]
    paths-ignore:
      - ".github/workflows/docs-pages.yml"
      - "apps/docs/**"
      - "diagrams/documentation-publication.svg"
      - "docs/**"
      - "*.md"
      - "**/*.md"
      - "packages/deploy-plan/**"
      - "scripts/validate-docs.mjs"
      - "scripts/validate-docs-build.mjs"
      - "tests/js/deploy-plan.test.mjs"
      - "tests/js/docs-*.test.mjs"
      - "xtask/src/docs.rs"

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard security analysis
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: "Run OpenSSF Scorecard"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF results
          path: results.sarif
          retention-days: 5
