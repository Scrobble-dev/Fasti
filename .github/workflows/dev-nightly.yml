name: Dev and Nightly Readiness (Non-Publishing)

on:
  push:
    branches: ["dev"]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oci-smoke:
    name: Build and smoke local OCI image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-no-publish.sh
      - run: docker build --tag fasti:nightly-readiness .
      - name: Verify image without publishing it
        run: bash scripts/smoke-oci.sh fasti:nightly-readiness
