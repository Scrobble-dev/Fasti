name: Reconcile merged Rust source once

on:
  pull_request:
    branches:
      - "release"
    types:
      - synchronize

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.number == 14 && github.event.pull_request.head.ref == 'security/b1-evidence-hardening-20260822' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt
      - name: Reconcile the merged manifest graph and standard formatting
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git log -1 --format=%s)" = "ci(repair): activate PR-bound merged source reconciliation"

          cargo fetch
          cargo fmt --all

          changed="$(git status --short | sed -E 's/^.. //')"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              Cargo.lock | apps/*.rs | apps/*/*.rs | apps/*/*/*.rs | crates/*.rs | crates/*/*.rs | crates/*/*/*.rs | crates/*/*/*/*.rs | xtask/*.rs | xtask/*/*.rs | xtask/*/*/*.rs)
                ;;
              *)
                echo "Unexpected reconciliation change: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed"

          grep -q '^name = "rusqlite"$' Cargo.lock
          git diff --check
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          cargo fmt --all -- --check

      - name: Commit the bounded generated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ryan Winkler"
          git config user.email "28455297+ryan-winkler@users.noreply.github.com"
          git add Cargo.lock apps crates xtask
          git commit -s \
            -m "chore(merge): reconcile lockfile and formatter output" \
            -m "Resolve the merged B2 manifest graph after the accepted dependency updates and apply the pinned Rust formatter." \
            -m "No product artifact is published. The one-time maintenance workflow is removed in the next reviewed commit."
          git push origin HEAD:security/b1-evidence-hardening-20260822
