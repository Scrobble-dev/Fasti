name: Governed Contract Conformance

on:
  push:
    branches: ["dev", "release"]
    paths-ignore:
      - ".github/workflows/docs-pages.yml"
      - "apps/docs/**"
      - "diagrams/documentation-publication.svg"
      - "docs/**"
      - "*.md"
      - "**/*.md"
      - "packages/deploy-plan/**"
      - "scripts/validate-docs.mjs"
      - "scripts/validate-docs-build.mjs"
      - "tests/js/deploy-plan.test.mjs"
      - "tests/js/docs-*.test.mjs"
      - "xtask/src/docs.rs"
  pull_request:
    branches: ["dev", "release"]
    paths-ignore:
      - ".github/workflows/docs-pages.yml"
      - "apps/docs/**"
      - "diagrams/documentation-publication.svg"
      - "docs/**"
      - "*.md"
      - "**/*.md"
      - "packages/deploy-plan/**"
      - "scripts/validate-docs.mjs"
      - "scripts/validate-docs-build.mjs"
      - "tests/js/deploy-plan.test.mjs"
      - "tests/js/docs-*.test.mjs"
      - "xtask/src/docs.rs"

permissions:
  contents: read

jobs:
  contract-conformance:
    name: OpenAPI, AsyncAPI, JSON Schema, JSON-LD, OKF, and SDK parity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
      - run: pnpm install --frozen-lockfile
      - run: cargo fetch --locked
      - name: Verify the governed B1 contract spine
        run: cargo xtask contract verify --locked
