name: PR 93 source snapshot

on:
  push:
    branches:
      - feat/floppy-allauth-sessions

permissions:
  contents: read

jobs:
  snapshot:
    name: Exact-head source snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create source archive
        shell: bash
        run: tar --exclude=.git --exclude=target --exclude=node_modules -czf /tmp/fasti-pr93-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fasti-pr93-source-${{ github.sha }}
          path: /tmp/fasti-pr93-source.tar.gz
          if-no-files-found: error
          retention-days: 1
