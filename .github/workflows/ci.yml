name: CI

on:
  push:
    branches: ["dev", "release"]
  pull_request:
    branches: ["dev", "release"]

permissions:
  contents: write

jobs:
  apply-reviewed-b2-source:
    name: Apply checksum-bound B2 source
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security/b1-evidence-hardening-20260822
          fetch-depth: 1
      - name: Verify the staged source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from base64 import b64decode; from pathlib import Path; source = Path(".fasti-staging/b2-source.tar.gz.b64"); encoded = "".join(source.read_text(encoding="utf-8").split()); encoded += "=" * (-len(encoded) % 4); Path("/tmp/b2-source.tar.gz").write_bytes(b64decode(encoded, validate=True))'
          echo "44848c330440cb0e5674e368c475d0a98848b8363ac03f22356ec89983fac196  /tmp/b2-source.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/b2-source.tar.gz | LC_ALL=C sort > /tmp/actual-paths.txt
          cat > /tmp/expected-paths.txt <<'PATHS'
          .github/workflows/ci.yml
          Cargo.lock
          Dockerfile
          apps/fastid/Cargo.toml
          apps/fastid/src/main.rs
          benchmarks/b1/Dockerfile
          crates/fasti-api/Cargo.toml
          crates/fasti-api/src/lib.rs
          crates/fasti-api/src/production.rs
          crates/fasti-application/src/capabilities.rs
          crates/fasti-application/src/kernel.rs
          crates/fasti-cli/Cargo.toml
          crates/fasti-cli/src/local.rs
          crates/fasti-cli/src/main.rs
          crates/fasti-contracts/Cargo.toml
          crates/fasti-contracts/src/generated_capability_ids.rs
          crates/fasti-contracts/src/lib.rs
          crates/fasti-contracts/src/production.rs
          crates/fasti-store/src/access.rs
          crates/fasti-store/src/lib.rs
          crates/fasti-store/src/status.rs
          PATHS
          LC_ALL=C sort -o /tmp/expected-paths.txt /tmp/expected-paths.txt
          diff --unified /tmp/expected-paths.txt /tmp/actual-paths.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/actual-paths.txt; then
            echo "Unsafe path found in staged source archive" >&2
            exit 1
          fi
      - name: Apply the reviewed source and remove staging surfaces
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/b2-source.tar.gz -C .
          rm -f .fasti-staging/b2-source.tar.gz.b64
          rmdir .fasti-staging
          rm -f .github/workflows/b2-apply-reviewed-source.yml
          rm -f .github/workflows/b2-format-evidence.yml
          git diff --check
      - name: Commit and push the reviewed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ryan Winkler"
          git config user.email "28455297+ryan-winkler@users.noreply.github.com"
          git add -A
          git commit -s \
            -m "feat(b2): expose the durable local kernel through API and CLI" \
            -m "Add the loopback-first production API, stable public B2 transport shapes, local node composition, authenticated status, content-addressed evidence upload, observation and receipt delivery, identity and review operations, credential lifecycle, listener configuration, provider-neutral seed handling, and a credential-free headless sandbox." \
            -m "Keep credential material in permission-restricted files, keep query strings free of credentials, preserve bounded request and replay behavior, keep Docker as one wrapper over the native runtime, and retain explicit later-body guards for export, restore, and verification." \
            -m "Reconcile the local package graph and retain a temporary read-only formatting export job for exact follow-up validation."
          git push origin HEAD:security/b1-evidence-hardening-20260822

  b1-portable-gate:
    name: Canonical B1 PR gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked Tauri Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget
      - run: pnpm install --frozen-lockfile
      - name: Fetch both locked Rust dependency graphs
        run: |
          cargo fetch --locked
          cargo fetch --manifest-path benchmarks/b1/tauri-shell/src-tauri/Cargo.toml --locked
      - name: Run governed contracts and portable benchmark sentinels
        run: cargo xtask test pr

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo metadata --locked --format-version 1 --no-deps
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --all-targets --locked

  javascript:
    name: Retained JavaScript packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  repository-truth:
    name: B0 repository truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: bash scripts/check-repository-truth.sh
      - run: bash scripts/check-no-publish.sh
      - run: bash scripts/test-no-publish-policy.sh
      - run: node scripts/check-doc-links.mjs

  oci:
    name: Daemon and CLI OCI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build strict OCI image
        run: docker build --tag fasti:b0 .
      - name: Verify non-root, health, false-success, and idle-memory gates
        run: bash scripts/smoke-oci.sh fasti:b0

  b2-workspace-export:
    name: B2 formatted workspace export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt
      - name: Reconcile the local lock graph and format Rust
        run: |
          cargo metadata --format-version 1 --no-deps >/dev/null
          cargo fmt --all
      - name: Capture the exact source and change
        run: |
          git diff --binary > /tmp/fasti-b2-workspace.patch
          tar \
            --exclude=.git \
            --exclude=target \
            --exclude=node_modules \
            --exclude='benchmarks/b1/tauri-shell/src-tauri/target' \
            -czf /tmp/fasti-b2-workspace.tar.gz .
          test -s /tmp/fasti-b2-workspace.patch
          test -s /tmp/fasti-b2-workspace.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fasti-b2-workspace
          path: |
            /tmp/fasti-b2-workspace.patch
            /tmp/fasti-b2-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
