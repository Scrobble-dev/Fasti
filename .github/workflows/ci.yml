name: CI

on:
  push:
    branches: ["dev", "release"]
  pull_request:
    branches: ["dev", "release"]

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo metadata --locked --format-version 1 --no-deps
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --all-targets --locked

  javascript:
    name: Retained JavaScript packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  repository-truth:
    name: B0 repository truth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/check-repository-truth.sh
      - run: bash scripts/check-no-publish.sh
      - run: bash scripts/test-no-publish-policy.sh
      - run: node scripts/check-doc-links.mjs

  oci:
    name: Daemon and CLI OCI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build strict OCI image
        run: docker build --tag fasti:b0 .
      - name: Verify non-root, health, false-success, and idle-memory gates
        run: bash scripts/smoke-oci.sh fasti:b0
