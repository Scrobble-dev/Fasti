name: PR 93 auth closeout

on:
  push:
    branches:
      - feat/floppy-allauth-sessions

permissions:
  contents: write

concurrency:
  group: pr-93-auth-closeout
  cancel-in-progress: false

jobs:
  closeout:
    name: Verify and close the account review
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the current branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: feat/floppy-allauth-sessions

      - name: Apply the fail-closed repair
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()

          contracts = root / "crates/fasti-contracts/src/browser_auth.rs"
          text = contracts.read_text()
          for name in ("WebAuthnPasskeyDto", "MfaStatusResponse"):
              marker = f"pub struct {name}"
              while marker in text:
                  at = text.index(marker)
                  start = text.rfind("\n\n", 0, at)
                  start = 0 if start < 0 else start + 2
                  brace = text.index("{", at)
                  depth = 0
                  end = None
                  for index in range(brace, len(text)):
                      if text[index] == "{":
                          depth += 1
                      elif text[index] == "}":
                          depth -= 1
                          if depth == 0:
                              end = index + 1
                              break
                  if end is None:
                      raise SystemExit(f"could not remove {name}")
                  while end < len(text) and text[end] == "\n":
                      end += 1
                  text = text[:start] + text[end:]
          contracts.write_text(text)

          application = root / "crates/fasti-application/src/browser_auth.rs"
          text = application.read_text()
          start = text.find("impl BrowserSessionSummary {")
          end = text.find("\npub struct ListBrowserSessionsQuery", start)
          if start < 0 or end < 0:
              raise SystemExit("session summary boundary not found")
          block = text[start:end]
          if 'location: "Not recorded".to_owned()' not in block:
              block = block.replace(
                  "        location: String,\n        device_type: String,\n",
                  "        _location: String,\n        _device_type: String,\n",
                  1,
              )
              block = block.replace(
                  "            location,\n            device_type,\n",
                  '            location: "Not recorded".to_owned(),\n'
                  '            device_type: "Not recorded".to_owned(),\n',
                  1,
              )
          text = text[:start] + block + text[end:]
          if "session_summary_does_not_invent_unrecorded_metadata" not in text:
              text += '''

#[cfg(test)]
mod session_inventory_tests {
    use super::*;

    #[test]
    fn session_summary_does_not_invent_unrecorded_metadata() {
        let observed_at = Utc::now();
        let summary = BrowserSessionSummary::new(
            "sess_0123456789ab".to_owned(),
            observed_at,
            observed_at,
            observed_at,
            "Local Host (127.0.0.1)".to_owned(),
            "Desktop Browser (Workbench)".to_owned(),
            true,
        );
        assert_eq!(summary.location(), "Not recorded");
        assert_eq!(summary.device_type(), "Not recorded");
    }
}
'''
          application.write_text(text)

          store = root / "crates/fasti-store/src/browser_auth.rs"
          text = store.read_text()
          text = text.replace(
              '"Local Host (127.0.0.1)".to_string(),\n'
              '                "Desktop Browser (Workbench)".to_string(),',
              '"Not recorded".to_string(),\n'
              '                "Not recorded".to_string(),',
          )
          auth_start = text.find("fn authenticate_session(")
          auth_end = text.find("\nimpl BrowserAccountPort for SqliteKernel", auth_start)
          if auth_start < 0 or auth_end < 0:
              raise SystemExit("authenticate session boundary not found")
          auth = text[auth_start:auth_end]
          if "UPDATE browser_sessions SET last_seen_at" not in auth:
              point = auth.rfind("    Ok(AuthenticatedBrowserSession::new(\n")
              if point < 0:
                  raise SystemExit("authenticated session result not found")
              update = '''    let seen_at = now();
    let update_before = timestamp(seen_at - Duration::minutes(1));
    map_sql(
        connection.execute(
            "UPDATE browser_sessions SET last_seen_at = ?1 WHERE session_digest = ?2 AND last_seen_at < ?3",
            params![timestamp(seen_at), session_digest, update_before],
        ),
        capability,
        correlation_id,
    )?;
'''
              auth = auth[:point] + update + auth[point:]
              text = text[:auth_start] + auth + text[auth_end:]
          switch_start = text.find("    fn switch_browser_session_profile(")
          switch_end = text.find("\n    fn list_browser_users(", switch_start)
          if switch_start < 0 or switch_end < 0:
              raise SystemExit("profile switch boundary not found")
          current = text[switch_start:switch_end]
          if "profile switching remains unavailable" not in current:
              replacement = '''    fn switch_browser_session_profile(
        &self,
        command: SwitchBrowserSessionProfileCommand,
    ) -> ApplicationResult<AuthenticatedBrowserSession> {
        let capability = CapabilityKey::ReadBrowserSession;
        let (correlation_id, _, _, _) = command.into_parts();
        // Profile selection must be scoped to one browser session. Updating the
        // browser user would change every active session and could create an
        // authorization grant as a side effect. Keep this capability closed
        // until the access model owns a session-scoped profile selection.
        Err(problem(
            ProblemCode::ValidationFailed,
            capability,
            correlation_id,
        ))
    }
'''
              text = text[:switch_start] + replacement + text[switch_end:]
          store.write_text(text)

          auth_doc = root / "docs/architecture/authentication.md"
          text = auth_doc.read_text()
          if "## Browser account sessions" not in text:
              text += '''

## Browser account sessions

The account dialog uses access-owned browser sessions. Password sign-in,
session inventory, session revocation, and administrator-owned browser-user
changes use the real host and server contracts.

The inventory reports location and device as `Not recorded` until a real request
metadata contract exists. Profile switching stays unavailable until profile
selection belongs to one session and cannot create a grant as a side effect.

Passkey, OIDC, and device authorization stay visible with a precise unavailable
state. The UI does not create TOTP secrets, PINs, local profiles, credentials, or
success state in browser storage.

Session inventory and revocation are synchronous HTTP capabilities in OpenAPI.
They publish no event, so AsyncAPI does not change. Browser-session security
state is not linked domain data, so JSON-LD does not apply.

Retained UI evidence: [`../quality/auth-account-accessibility-evidence.md`](../quality/auth-account-accessibility-evidence.md).
'''
          auth_doc.write_text(text)

          for path in (
              ".github/workflows/pr93-source-snapshot.yml",
              ".github/workflows/pr93-final-auth-integrity.yml",
              ".github/workflows/pr93-auth-closeout.yml",
          ):
              file = root / path
              if file.exists():
                  file.unlink()
          PY

          test ! -e .github/workflows/pr93-source-snapshot.yml
          test ! -e .github/workflows/pr93-final-auth-integrity.yml
          test ! -e .github/workflows/pr93-auth-closeout.yml
          ! grep -R "MfaStatusResponse\|WebAuthnPasskeyDto" crates/fasti-contracts/src/browser_auth.rs
          grep -q 'location: "Not recorded".to_owned()' crates/fasti-application/src/browser_auth.rs
          grep -q 'UPDATE browser_sessions SET last_seen_at' crates/fasti-store/src/browser_auth.rs
          grep -q 'profile switching remains unavailable' crates/fasti-store/src/browser_auth.rs
          ! grep -q '"Local Host (127.0.0.1)".to_string()' crates/fasti-store/src/browser_auth.rs
          git diff --check

      - name: Run focused repository gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p fasti-application -p fasti-contracts -p fasti-store -p fasti-api
          cargo xtask contract verify
          corepack enable
          pnpm install --frozen-lockfile
          pnpm lint:ui
          pnpm build
          pnpm test:ui

      - name: Commit the verified closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ryan Winkler"
          git config user.email "28455297+ryan-winkler@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -s -m "fix(auth): close the account security review" \
            -m "Keep browser-session state truthful, fail closed on unsafe profile switching, retain accessibility evidence, and remove temporary review workflows."
          git push origin "HEAD:${GITHUB_REF_NAME}"
