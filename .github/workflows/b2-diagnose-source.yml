name: Diagnose reviewed B2 source

on:
  pull_request:
    branches:
      - "release"

permissions:
  contents: read

jobs:
  diagnose-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Report invalid Base64 positions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.fasti-staging/b2-source.tar.gz.b64')
          raw = path.read_text(encoding='utf-8')
          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\r\n\t ')
          invalid = [(index, char) for index, char in enumerate(raw) if char not in alphabet]
          print(f'length={len(raw)} invalid_count={len(invalid)} remainder={len("".join(raw.split())) % 4}')
          for index, char in invalid[:32]:
              start = max(0, index - 48)
              end = min(len(raw), index + 96)
              print(f'index={index} codepoint={ord(char)} context={raw[start:end]!r}')
          if not invalid:
              raise SystemExit('No invalid Base64 characters were found')
          PY
